[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homely2mqtt"
version = "0.1.0"
description = "Publish Homely alarm sensors, alarm state and Yale locks to MQTT via the Homely API, live over its websocket"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "paho-mqtt>=2.0,<3",
    "python-socketio[client]>=5.11,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
homely2mqtt = "homely2mqtt.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
